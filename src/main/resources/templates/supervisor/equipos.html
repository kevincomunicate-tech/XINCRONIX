<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipos | Xincronix</title><style>body{font-family:Arial,sans-serif;margin:2rem;color:#172033}nav{margin-bottom:2rem}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.75rem;text-align:left}th{background:#f4f6f8}</style></head>
<body><nav><a th:href="@{/supervisor/dashboard}">Dashboard</a> | <a th:href="@{/supervisor/empleados}">Empleados</a> | <a th:href="@{/supervisor/proyectos}">Proyectos</a></nav><h1>Equipos</h1><table><thead><tr><th>Nombre</th><th>Descripcion</th><th>Miembros</th></tr></thead><tbody><tr th:each="equipo : ${equipos}"><td th:text="${equipo.nombre}">Equipo</td><td th:text="${equipo.descripcion != null ? equipo.descripcion : '-'}">Descripcion</td><td th:text="${equipo.miembros != null ? equipo.miembros : 0}">0</td></tr><tr th:if="${#lists.isEmpty(equipos)}"><td colspan="3">No hay equipos registrados.</td></tr></tbody></table></body></html>
