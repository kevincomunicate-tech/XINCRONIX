<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proyectos | Xincronix</title><style>body{font-family:Arial,sans-serif;margin:2rem;color:#172033}nav{margin-bottom:2rem}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.75rem;text-align:left}th{background:#f4f6f8}</style></head>
<body><nav><a th:href="@{/supervisor/dashboard}">Dashboard</a> | <a th:href="@{/supervisor/empleados}">Empleados</a> | <a th:href="@{/supervisor/equipos}">Equipos</a></nav><h1>Proyectos</h1><table><thead><tr><th>Nombre</th><th>Descripcion</th><th>Estado</th></tr></thead><tbody><tr th:each="proyecto : ${proyectos}"><td th:text="${proyecto.nombre}">Proyecto</td><td th:text="${proyecto.descripcion != null ? proyecto.descripcion : '-'}">Descripcion</td><td th:text="${proyecto.estado}">Activo</td></tr><tr th:if="${#lists.isEmpty(proyectos)}"><td colspan="3">No hay proyectos registrados.</td></tr></tbody></table></body></html>
