<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empleados | Xincronix</title><style>body{font-family:Arial,sans-serif;margin:2rem;color:#172033}nav{margin-bottom:2rem}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.75rem;text-align:left}th{background:#f4f6f8}.badge{padding:.25rem .5rem;border-radius:1rem;background:#e5e7eb}.activo{background:#d1fae5;color:#065f46}.inactivo{background:#fee2e2;color:#991b1b}</style></head>
<body><nav><a th:href="@{/supervisor/dashboard}">Dashboard</a> | <a th:href="@{/supervisor/proyectos}">Proyectos</a> | <a th:href="@{/supervisor/equipos}">Equipos</a></nav><h1>Empleados</h1><p th:text="${nombreCompleto}">Supervisor</p><table><thead><tr><th>Nombre</th><th>Email</th><th>Cargo</th><th>Estado</th></tr></thead><tbody><tr th:each="empleado : ${empleados}"><td th:text="${empleado.nombres + ' ' + empleado.apellidos}">Nombre</td><td th:text="${empleado.email}">email</td><td th:text="${empleado.cargo != null ? empleado.cargo : '-'}">Cargo</td><td><span class="badge activo" th:if="${empleado.estado}">Activo</span><span class="badge inactivo" th:unless="${empleado.estado}">Inactivo</span></td></tr><tr th:if="${#lists.isEmpty(empleados)}"><td colspan="4">No hay empleados registrados.</td></tr></tbody></table></body></html>
