<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | Xincronix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#07101f;--navy:#0d1f3c;--electric:#2a5bff;--sky:#5b8bff;--white:#fff;--muted:#71809e;--danger:#ef4444;--success:#10b981}
    *{box-sizing:border-box} body{min-height:100vh;margin:0;background:var(--ink);color:var(--white);font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(42,91,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(42,91,255,.06) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse 75% 70% at 50% 50%,#000,transparent)}
    .glow{position:fixed;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(42,91,255,.2),transparent 68%);top:-250px;right:-180px;pointer-events:none}
    .card{position:relative;width:min(100%,440px);padding:42px;background:linear-gradient(145deg,rgba(19,39,75,.96),rgba(7,16,31,.98));border:1px solid rgba(173,198,255,.18);border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.34)}
    .brand{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:21px;font-weight:800}.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:rgba(42,91,255,.2);border:1px solid rgba(91,139,255,.35);color:var(--sky);font-size:14px}.brand span{color:var(--sky)}
    .icon{width:52px;height:52px;display:grid;place-items:center;margin:34px 0 17px;border-radius:15px;background:rgba(42,91,255,.15);border:1px solid rgba(91,139,255,.23);font-size:24px}h1{margin:0 0 9px;font:800 27px/1.2 'Syne',sans-serif}p{margin:0;color:#b4c0d7;font-size:14px;line-height:1.65}.field{margin-top:28px}.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#dce6fb}.input-wrap{display:flex;align-items:center;background:rgba(255,255,255,.055);border:1px solid rgba(173,198,255,.2);border-radius:10px;transition:.2s}.input-wrap:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(91,139,255,.12)}.input-wrap.invalid{border-color:var(--danger)}.input-wrap span{padding-left:14px;color:#90a9de}input{width:100%;border:0;outline:0;padding:14px 14px 14px 11px;background:transparent;color:var(--white);font:14px 'DM Sans',sans-serif}input::placeholder{color:#7b89a6}.error{min-height:18px;margin:7px 1px 0;color:#fca5a5;font-size:12px}.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;margin-top:17px;border:0;border-radius:10px;background:var(--electric);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:.2s}.btn:hover:not(:disabled){background:#3e6bff;transform:translateY(-1px)}.btn:disabled{opacity:.68;cursor:wait}.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.btn.loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}.notice{display:none;margin-top:22px;padding:13px 14px;border-radius:10px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);color:#baf4df;font-size:13px;line-height:1.55}.notice.show{display:block}.back{display:block;margin-top:25px;text-align:center;color:#aebddb;font-size:13px;text-decoration:none}.back:hover{color:var(--white)}@media(max-width:480px){body{padding:16px}.card{padding:30px 24px}.icon{margin-top:28px}}
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="card">
    <div class="brand"><div class="brand-icon">XN</div>Xin<span>cronix</span></div>
    <div class="icon">✉</div>
    <h1>Recupera tu contraseña</h1>
    <p>Indica el correo de tu cuenta. Si está registrado, recibirás un enlace seguro para crear una contraseña nueva.</p>
    <form id="forgot-password-form" novalidate>
      <div class="field">
        <label for="email">Correo corporativo</label>
        <div class="input-wrap" id="email-wrap"><span>✉</span><input id="email" type="email" autocomplete="email" placeholder="tu@empresa.com" required></div>
        <div class="error" id="error" role="alert"></div>
      </div>
      <button class="btn" id="submit" type="submit"><span class="spinner"></span><span id="button-label">Enviar enlace de recuperación</span></button>
    </form>
    <div class="notice" id="notice" role="status"></div>
    <a class="back" href="/login">← Volver a iniciar sesión</a>
  </main>
  <script>
    const form = document.getElementById('forgot-password-form');
    const email = document.getElementById('email');
    const error = document.getElementById('error');
    const emailWrap = document.getElementById('email-wrap');
    const button = document.getElementById('submit');
    const notice = document.getElementById('notice');
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    email.addEventListener('input', () => { error.textContent = ''; emailWrap.classList.remove('invalid'); });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const value = email.value.trim();
      if (!emailPattern.test(value)) {
        error.textContent = 'Ingresa un correo electrónico válido.';
        emailWrap.classList.add('invalid');
        email.focus();
        return;
      }
      button.disabled = true;
      button.classList.add('loading');
      notice.classList.remove('show');
      try {
        const response = await fetch('/api/auth/password/forgot', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
          body: JSON.stringify({email: value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'No fue posible procesar la solicitud.');
        form.hidden = true;
        notice.textContent = data.message || 'Si existe una cuenta para ese correo, enviamos el enlace de recuperación.';
        notice.classList.add('show');
      } catch (requestError) {
        error.textContent = requestError.message || 'Error de conexión. Inténtalo de nuevo.';
        emailWrap.classList.add('invalid');
      } finally {
        button.disabled = false;
        button.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
