<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña | Xincronix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#07101f;--electric:#2a5bff;--sky:#5b8bff;--white:#fff;--danger:#ef4444;--success:#10b981}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;overflow:hidden;background:#07101f;color:#fff;font-family:'DM Sans',sans-serif}body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 82% 10%,rgba(42,91,255,.25),transparent 29%),radial-gradient(circle at 5% 85%,rgba(91,139,255,.12),transparent 30%)}.card{position:relative;width:min(100%,440px);padding:42px;background:linear-gradient(145deg,rgba(19,39,75,.96),rgba(7,16,31,.98));border:1px solid rgba(173,198,255,.18);border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.34)}.brand{display:flex;align-items:center;gap:10px;font:800 21px 'Syne',sans-serif}.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:rgba(42,91,255,.2);border:1px solid rgba(91,139,255,.35);color:var(--sky);font-size:14px}.brand span{color:var(--sky)}.icon{width:52px;height:52px;display:grid;place-items:center;margin:34px 0 17px;border-radius:15px;background:rgba(42,91,255,.15);border:1px solid rgba(91,139,255,.23);font-size:24px}h1{margin:0 0 9px;font:800 27px/1.2 'Syne',sans-serif}p{margin:0;color:#b4c0d7;font-size:14px;line-height:1.65}.field{margin-top:22px}.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#dce6fb}.input-wrap{display:flex;align-items:center;background:rgba(255,255,255,.055);border:1px solid rgba(173,198,255,.2);border-radius:10px;transition:.2s}.input-wrap:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(91,139,255,.12)}.input-wrap.invalid{border-color:var(--danger)}.input-wrap span{padding-left:14px;color:#90a9de}input{width:100%;border:0;outline:0;padding:14px 12px 14px 11px;background:transparent;color:#fff;font:14px 'DM Sans',sans-serif}input::placeholder{color:#7b89a6}.toggle{border:0;padding:10px 13px;background:transparent;color:#b7c6e4;cursor:pointer;font-size:16px}.error{min-height:18px;margin:7px 1px 0;color:#fca5a5;font-size:12px}.btn{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;min-height:48px;margin-top:17px;border:0;border-radius:10px;background:var(--electric);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:.2s}.btn:hover:not(:disabled){background:#3e6bff;transform:translateY(-1px)}.btn:disabled{opacity:.68;cursor:wait}.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.btn.loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}.notice{display:none;margin-top:22px;padding:13px 14px;border-radius:10px;font-size:13px;line-height:1.55}.notice.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fecaca}.notice.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#baf4df}.notice.show{display:block}.back{display:block;margin-top:25px;text-align:center;color:#aebddb;font-size:13px;text-decoration:none}.back:hover{color:#fff}@media(max-width:480px){body{padding:16px}.card{padding:30px 24px}.icon{margin-top:28px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-icon">XN</div>Xincronix</div>
    <div class="icon">🔒</div>
    <h1>Crea una contraseña nueva</h1>
    <p>Elige una contraseña de al menos 8 caracteres. El enlace de recuperación solo puede usarse una vez.</p>
    <form id="reset-password-form" novalidate>
      <div class="field"><label for="password">Nueva contraseña</label><div class="input-wrap" id="password-wrap"><span>🔒</span><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required><button class="toggle" type="button" data-target="password" aria-label="Mostrar contraseña">👁</button></div></div>
      <div class="field"><label for="confirmation">Confirmar nueva contraseña</label><div class="input-wrap" id="confirmation-wrap"><span>🔒</span><input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Repite la contraseña" required><button class="toggle" type="button" data-target="confirmation" aria-label="Mostrar contraseña">👁</button></div><div class="error" id="error" role="alert"></div></div>
      <button class="btn" id="submit" type="submit"><span class="spinner"></span><span>Actualizar contraseña</span></button>
    </form>
    <div class="notice" id="notice" role="status"></div>
    <a class="back" href="/login">← Volver a iniciar sesión</a>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('reset-password-form');
    const password = document.getElementById('password');
    const confirmation = document.getElementById('confirmation');
    const error = document.getElementById('error');
    const notice = document.getElementById('notice');
    const button = document.getElementById('submit');
    document.querySelectorAll('.toggle').forEach(toggle => toggle.addEventListener('click', () => {
      const input = document.getElementById(toggle.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
      toggle.textContent = input.type === 'password' ? '👁' : '🙈';
    }));
    [password, confirmation].forEach(input => input.addEventListener('input', () => {
      error.textContent = '';
      document.getElementById('password-wrap').classList.remove('invalid');
      document.getElementById('confirmation-wrap').classList.remove('invalid');
    }));
    function showNotice(message, type) { notice.textContent = message; notice.className = 'notice show ' + type; }
    if (!token) { form.hidden = true; showNotice('Este enlace de recuperación no es válido. Solicita uno nuevo.', 'error'); }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (password.value.length < 8) { error.textContent = 'La contraseña debe tener al menos 8 caracteres.'; document.getElementById('password-wrap').classList.add('invalid'); return; }
      if (password.value !== confirmation.value) { error.textContent = 'Las contraseñas no coinciden.'; document.getElementById('confirmation-wrap').classList.add('invalid'); return; }
      button.disabled = true; button.classList.add('loading'); notice.classList.remove('show');
      try {
        const response = await fetch('/api/auth/password/reset', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({token, password:password.value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'No fue posible actualizar la contraseña.');
        form.hidden = true; showNotice(data.message || 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
        setTimeout(() => location.assign('/login'), 1800);
      } catch (requestError) { showNotice(requestError.message || 'Error de conexión. Inténtalo nuevamente.', 'error'); }
      finally { button.disabled = false; button.classList.remove('loading'); }
    });
  </script>
</body>
</html>
