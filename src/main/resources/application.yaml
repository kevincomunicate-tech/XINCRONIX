spring:
  application:
    name: Xincronix
  datasource:
    url: ${XNX_DB_URL:jdbc:mariadb://localhost:3307/xincronix_bd}
    username: ${XNX_DB_USERNAME:root}
    password: ${XNX_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

xincronix:
  uploads:
    directory: uploads/comprobantes
  jwt:
    secret: ${XNX_JWT_SECRET:change-this-secret-in-production-32-bytes-min}
    expiration-ms: ${XNX_JWT_EXPIRATION_MS:86400000}
